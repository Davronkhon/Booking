<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>22 лучших формы входа и регистрации | Vladmaxi.net</title>
	<link rel="stylesheet" href="css/style.css" media="screen" type="text/css" />
	<link rel="icon" href="http://vladmaxi.net/favicon.ico" type="image/x-icon">
	<link rel="shortcut icon" href="http://vladmaxi.net/favicon.ico" type="image/x-icon">
</head>

<body>

<!-- vladmaxi top bar -->

<div class="login-form-wrap">
	<div class="card-holder-wrap">
		<div class="hole"></div>
		<div class="l-stroke"></div>
		<div class="r-stroke"></div>
		<div class="ring-large-wrap"></div>
		<div class="ring-small-wrap"></div>
	</div>
	<form action="#" class="login-form">
		<h1 class="freeb"><img src="http://i.imgur.com/U4E6o3x.png" alt="freebies gallery"></h1>
		<div class="input-wrap">
			<label for="" class="user-id"><input type="text" name="userId" placeholder="Введите Ваш ID пользователя"></label> 
			<hr class="form-hr">
			<label for="" class="password"><input type="password" name="password" placeholder="Ваш сложный пароль"></label> 
		</div>
		<div class="remember">
			<span>Запомнить?</span>
			<div class="switch">
				<input type="checkbox" id="switch" class="switch-check">
				<label for="switch" class="switch-label">				   
				<span class="switch-slider switch-slider-on"></span>
				<span class="switch-slider switch-slider-off"></span></label>

			</div>
		</div>
		<input type="submit" class="button" value="ВОЙТИ">
		<a href="#" class="forgot">Забыл пароль?</a>
	</form>
</div>

</body>
</html>
